run_id: qwen35_0p8b_libero_after_dexycb_h100_spatial
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false

framework:
  name: QwenSpatialOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gradient_checkpointing: false
  action_model:
    action_dim: 7
    action_hidden_dim: 1024
    action_model_type: MLP
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
  spatial:
    width: 256
    heads: 4
    ffn_width: 1024
    layers: 2
    tau: [1, 2, 4, 8]
    waypoint_weight: 1.0
    waypoint_rotation_weight: 0.25
    action_geometry_weight: 0.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_spatial_oft_all
    geometry_sidecar_root: playground/DerivedData/libero_spatial_oft_v1
    waypoint_tau: [1, 2, 4, 8]
    per_device_batch_size: 32
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    video_backend: torchvision_av

trainer:
  task_mode: robot_policy
  max_train_steps: 5000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 100
  learning_rate:
    base: 2.5e-5
    waypoint_model: 1.0e-4
    spatial_adapter: 5.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: waypoint_model.human_anchor_projection,waypoint_model.human_side_embedding
  is_resume: false
  pretrained_checkpoint: playground/Checkpoints/qwen35_0p8b_dexycb_h100_geometry_pretrain/composed_for_libero_pytorch_model.pt
  reload_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
