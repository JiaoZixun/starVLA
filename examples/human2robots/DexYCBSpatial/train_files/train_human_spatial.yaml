run_id: qwen35_0p8b_dexycb_h500_geometry_e50
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false

framework:
  name: QwenSpatialOFT
  qwenvl:
    base_vlm: /home/jiao/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17
    attn_implementation: sdpa
    local_files_only: true
    gradient_checkpointing: false
  action_model:
    action_dim: 7
    action_hidden_dim: 1024
    action_model_type: MLP
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
  spatial:
    width: 256
    heads: 4
    ffn_width: 1024
    layers: 2
    tau: [1, 2, 4, 8]
    waypoint_weight: 1.0
    waypoint_rotation_weight: 0.25
    action_geometry_weight: 0.0

datasets:
  vla_data:
    dataset_py: human_wrist_dataset
    data_root_dir: /home/data/DexYCB_data
    geometry_sidecar_root: playground/DerivedData/dexycb_spatial_v1
    sequence_manifest: h500/samples.jsonl
    waypoint_tau: [1, 2, 4, 8]
    per_device_batch_size: 32
    drop_last: false
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    obs_image_size: [224, 224]

trainer:
  task_mode: human_geometry_pretrain
  max_train_epochs: 50
  max_train_steps: null  # Resolved as ceil(len(dataloader) / gradient_accumulation_steps) * max_train_epochs.
  num_warmup_steps: 500
  save_interval: 992  # H500: ceil(31719 / 32) = 992 batches per epoch.
  eval_interval: 0
  learning_rate:
    base: 5.0e-5
    qwen_vl_interface: 1.0e-6
    waypoint_model: 5.0e-5
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  freeze_modules: action_model,spatial_adapter,waypoint_model.anchor_projection
  is_resume: false
  # Qwen3.5-0.8B is loaded directly by qwenvl.base_vlm above; no StarVLA/LIBERO checkpoint is used.
  pretrained_checkpoint: null
  reload_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
