run_id: qwen35_0p8b_dexycb_h100_geometry_pretrain
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false

framework:
  name: QwenSpatialOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gradient_checkpointing: false
  action_model:
    action_dim: 7
    action_hidden_dim: 1024
    action_model_type: MLP
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
  spatial:
    width: 256
    heads: 4
    ffn_width: 1024
    layers: 2
    tau: [1, 2, 4, 8]
    waypoint_weight: 1.0
    waypoint_rotation_weight: 0.25
    action_geometry_weight: 0.0

datasets:
  vla_data:
    dataset_py: human_wrist_dataset
    data_root_dir: playground/Datasets/DEXYCB
    geometry_sidecar_root: playground/DerivedData/dexycb_spatial_v1
    sequence_manifest: splits/h100.jsonl
    waypoint_tau: [1, 2, 4, 8]
    per_device_batch_size: 32
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    obs_image_size: [224, 224]

trainer:
  task_mode: human_geometry_pretrain
  max_train_steps: 5000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 0
  learning_rate:
    base: 5.0e-5
    qwen_vl_interface: 1.0e-6
    waypoint_model: 5.0e-5
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  freeze_modules: action_model,spatial_adapter,waypoint_model.anchor_projection
  is_resume: false
  pretrained_checkpoint: playground/Checkpoints/qwen35_0p8b_oft_libero_50k/checkpoints/steps_50000_pytorch_model.pt
  reload_modules: qwen_vl_interface,action_model
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
