run_id: robodojo_v30_qwen35_0p8b_spatial_mem_stage_a
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: disabled
wandb_project: starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenSpatialMemOFT
  qwenvl:
    base_vlm: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/base_model/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 14
    slots: 8
    bptt_records: 8
    dropout: 0.0
    state_dim: 14
    action_horizon: 50
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
  spatial:
    enabled: true
    width: 256
    layers: 2
    heads: 4
    ffn_width: 1024
    tau: [1, 8, 16, 32, 50]
    lambda_wp: 1.0
    lambda_rel: 0.25
    # Enabled after the exact RoboDojo command/FK contract is separately validated.
    lambda_geom: 0.0
  memory:
    required: true
    width: 256
    heads: 4
    layers: 2
    recent_records: 16
    decision_stride_env_steps: 8
    use_pose: false
    state_dim: 14
    action_dim: 14

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    state_action_dtype: float32
    data_root_dir: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/data/starvla_robodojo_v30
    data_mix: robodojo_v30_all_h50_q99
    lerobot_version: v3.0
    action_type: abs_qpos
    action_mode: abs
    spatial_sidecar_dir: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/data/starvla_robodojo_v30/spatial_sidecar
    spatial_tau: [1, 8, 16, 32, 50]
    # Benchmark this real batch size on the target A800 before a long run.
    per_device_batch_size: 16
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    memory_enabled: true
    memory_sidecar_dir: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/memory_sidecars/robodojo_v30_r16_s8_visual_v2
    memory_recent_records: 16
    memory_decision_stride: 8
    memory_state_dim: 14
    memory_action_dim: 14
    memory_use_pose: false
    memory_bptt_records: 8
    memory_visual_tokens: 8
    memory_visual_views: 3
    memory_dropout: 0.0

trainer:
  max_train_steps: 5000
  num_warmup_steps: 5000
  save_interval: 1000
  eval_interval: 10000
  pretrained_checkpoint: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/trained_checkpoint/robodojo_v30_qwen35_0p8b_oft/final_model/pytorch_model.pt
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    waypoint_model: 1.0e-4
    spatial_adapter: 5.0e-5
    execution_memory: 1.0e-4
    memory_waypoint_projection: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
