run_id: robodojo_v30_qwen35_0p8b_oft
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: disabled
wandb_project: starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/data/robodojo_cache/starvla_robodojo_v30
    data_mix: robodojo_v30_all_h50_q99
    lerobot_version: v3.0
    action_type: abs_qpos
    action_mode: abs
    per_device_batch_size: 2
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    pin_memory: true

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
