run_id: robodojo_v30_qwen35_0p8b_spatial_stage_a
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: disabled
wandb_project: starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenSpatialOFT
  qwenvl:
    base_vlm: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/base_model/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
  spatial:
    enabled: true
    width: 256
    layers: 2
    heads: 4
    ffn_width: 1024
    tau: [1, 8, 16, 32, 50]
    lambda_wp: 1.0
    lambda_rel: 0.25
    # Enabled after the exact RoboDojo command/FK contract is separately validated.
    lambda_geom: 0.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/data/starvla_robodojo_v30
    data_mix: robodojo_v30_all_h50_q99
    lerobot_version: v3.0
    action_type: abs_qpos
    action_mode: abs
    spatial_sidecar_dir: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/data/starvla_robodojo_v30/spatial_sidecar
    spatial_tau: [1, 8, 16, 32, 50]
    # Reduce the per-device batch from 32 after the A800 OOM on the first step.
    per_device_batch_size: 16
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 4
    pin_memory: true

trainer:
  max_train_steps: 5000
  num_warmup_steps: 5000
  save_interval: 1000
  eval_interval: 1000
  pretrained_checkpoint: /public/home/jiaozixun/robodojo_spatial_training_bundle_20261013/trained_checkpoint/robodojo_v30_qwen35_0p8b_oft/final_model/pytorch_model.pt
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    waypoint_model: 1.0e-4
    spatial_adapter: 5.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
