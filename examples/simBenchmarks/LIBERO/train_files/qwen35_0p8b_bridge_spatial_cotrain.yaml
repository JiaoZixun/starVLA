# Exp A: Bridge-Spatial OFT co-trained on LIBERO + DexYCB (plan 1+2), from raw Qwen3.5-0.8B.
# Differs from qwen35_0p8b_bridge_spatial_only.yaml in: domain-aware arm_id (always on), gravity anchor,
# 1:3 human:robot interleave with the dexycb_cotrain_v2 sidecar (time-rescaled, per-object language).
# See examples/human2robots/DexYCBSpatial/PLAN_cotrain_phase.md.
run_id: qwen35_0p8b_bridge_spatial_cotrain_libero_50k
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false

framework:
  name: QwenSpatialOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    local_files_only: true
    local_model_path: null
    attn_implementation: sdpa
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gradient_checkpointing: false
  action_model:
    action_dim: 7
    action_hidden_dim: 1024
    action_model_type: MLP
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
  spatial:
    width: 256
    heads: 4
    ffn_width: 1024
    layers: 2
    adapter_version: v2
    # VLA-Adapter Bridge Attention: hidden_states indices read by the waypoint
    # decoder and the spatial action adapter (one Bridge block per layer).
    bridge_layers: [6, 12, 18, 24]
    tau: [1, 2, 4, 8]
    waypoint_weight: 1.0
    waypoint_rotation_weight: 0.25
    gripper_weight: 0.10
    action_geometry_weight: 0.0
    effect_weight: 0.0
    anchor_mode: gravity

datasets:
  vla_data:
    dataset_py: cotrain_human_robot
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_spatial_oft_long2x
    geometry_sidecar_root: playground/DerivedData/libero_spatial_oft_v1
    waypoint_tau: [1, 2, 4, 8]
    drop_incomplete_action_chunks: true
    per_device_batch_size: 32
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    video_backend: torchvision_av
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    # Human batches (one domain per batch): every human_every-th batch is DexYCB.
    human_data:
      geometry_sidecar_root: playground/DerivedData/dexycb_cotrain_v2
      split: train
      human_every: 4
      image_size: 224
      per_device_batch_size: 32
      drop_last: true
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 2

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 0
  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    waypoint_model: 5.0e-5
    spatial_adapter: 2.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  is_resume: false
  pretrained_checkpoint: null
  reload_modules: null
  strict_reload: true
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
