run_id: qwen35_0p8b_oft_libero_50k
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: jinhuiye
wandb_project: starVLA_LIBERO_Qwen35_OFT
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gradient_checkpointing: true
  action_model:
    action_dim: 7
    # Qwen3-VL-4B OFT head expects width 2560, so preserve the 0.8B native
    # width and initialize this incompatible head at 1024 instead of bridging it.
    action_hidden_dim: 1024 # Qwen3.5-0.8B native hidden width; action head is initialized at this width.
    action_model_type: MLP
    future_action_window_size: 7
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    per_device_batch_size: 32 # Fixed after final-structure A100 40 GB smoke testing; no runtime search.
    num_workers: 4
    video_backend: torchvision_av
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  # First start: Qwen3.5-0.8B HF weights + native 1024-wide OFT head.
  # Restart: load the latest saved full model checkpoint for this run.
  is_resume: true
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
