run_id: robotwin_clean_spatial_mem
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: disabled
wandb_project: starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenSpatialMemOFT
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
  spatial:
    enabled: true
    width: 256
    layers: 2
    heads: 4
    ffn_width: 1024
    tau: [1, 8, 16, 32, 50]
    lambda_wp: 1.0
    lambda_rel: 0.25
    lambda_geom: 0.0
  memory:
    required: true
    width: 256
    heads: 4
    layers: 2
    recent_records: 16
    decision_stride_env_steps: 8
    use_pose: false
    state_dim: 14
    action_dim: 14

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    state_action_dtype: float32
    data_root_dir: playground/Datasets/RoboTwin/lerobot_clean
    data_mix: robotwin_clean
    lerobot_version: v2.0
    action_type: abs_qpos
    action_mode: abs
    memory_enabled: true
    memory_sidecar_root: playground/Datasets/RoboTwin/memory_sidecars/robotwin_clean_r16_s8_v1
    memory_recent_records: 16
    memory_decision_stride: 8
    memory_state_dim: 14
    memory_action_dim: 14
    memory_use_pose: false
    per_device_batch_size: 4
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    # OpenCV is fork-safe for the worker pool on this host; PyAV workers
    # segfault during multi-worker video decode.
    video_backend: opencv
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    waypoint_model: 1.0e-4
    spatial_adapter: 5.0e-5
    execution_memory: 1.0e-4
    memory_waypoint_projection: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
